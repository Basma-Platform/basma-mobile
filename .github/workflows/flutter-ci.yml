name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Normalize and emit Dart source for review
        run: |
          dart format lib test
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in changed:
              if not path.endswith('.dart'):
                  continue
              data = json.dumps(pathlib.Path(path).read_text(), ensure_ascii=True)
              for index in range(0, len(data), 2000):
                  print('FMT|' + path + '|' + str(index // 2000) + '|' + data[index:index + 2000])
          PY
          dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
